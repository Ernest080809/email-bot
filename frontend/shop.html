<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleHub – Dein Modestore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* ── HEADER ── */
    header {
      background: #111;
      color: #fff;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    header .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; }
    header .logo span { color: #e63946; }
    nav a {
      color: #ccc;
      text-decoration: none;
      margin-left: 24px;
      font-size: .95rem;
      transition: color .2s;
    }
    nav a:hover { color: #fff; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      text-align: center;
      padding: 80px 20px;
    }
    .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 14px; }
    .hero h1 span { color: #e63946; }
    .hero p { font-size: 1.15rem; color: #aac; max-width: 560px; margin: 0 auto 28px; }
    .hero button {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 14px 38px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .hero button:hover { background: #c1121f; transform: scale(1.04); }

    /* ── FILTER BAR ── */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 28px 20px 10px;
    }
    .filter-btn {
      background: #fff;
      border: 2px solid #ddd;
      padding: 8px 22px;
      border-radius: 20px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      transition: all .2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* ── GRID ── */
    .section-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin: 20px 0 24px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding: 0 40px 60px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      transition: transform .22s, box-shadow .22s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 28px rgba(0,0,0,.15);
    }

    .card-visual {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      position: relative;
      overflow: hidden;
    }
    .card-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.04);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #e63946;
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: .5px;
      z-index: 1;
    }

    .card-body { padding: 16px 18px 18px; }
    .card-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .card-body .style-tag {
      display: inline-block;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: .75rem;
      padding: 2px 8px;
      margin-bottom: 10px;
      color: #555;
    }
    .card-body .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: #111;
    }
    .card-body .old-price {
      font-size: .85rem;
      color: #aaa;
      text-decoration: line-through;
      margin-left: 6px;
    }
    .card-body .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .btn-cart {
      background: #111;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-cart:hover { background: #e63946; }

    .color-dots { display: flex; gap: 5px; }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ccc;
    }

    /* ── FOOTER ── */
    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px;
      font-size: .9rem;
    }
    footer span { color: #e63946; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Style<span>Hub</span></div>
  <nav>
    <a href="#">Neu</a>
    <a href="#">Sale</a>
    <a href="#">Herren</a>
    <a href="#">Damen</a>
    <a href="#">Kontakt</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Mode die <span>bewegt</span></h1>
  <p>Entdecke 25 handverlesene Styles – von casual bis elegant, für jeden Anlass.</p>
  <button onclick="document.querySelector('.grid').scrollIntoView({behavior:'smooth'})">Jetzt shoppen</button>
</section>

<!-- FILTER -->
<div class="filters">
  <button class="filter-btn active" onclick="filter(this,'all')">Alle</button>
  <button class="filter-btn" onclick="filter(this,'casual')">Casual</button>
  <button class="filter-btn" onclick="filter(this,'streetwear')">Streetwear</button>
  <button class="filter-btn" onclick="filter(this,'elegant')">Elegant</button>
  <button class="filter-btn" onclick="filter(this,'sport')">Sport</button>
  <button class="filter-btn" onclick="filter(this,'vintage')">Vintage</button>
  <button class="filter-btn" onclick="filter(this,'outdoor')">Outdoor</button>
</div>

<p class="section-title">Unsere Kollektion</p>

<!-- PRODUCT GRID -->
<div class="grid" id="grid"></div>

<!-- FOOTER -->
<footer>
  &copy; 2026 <span>StyleHub</span> – Alle Rechte vorbehalten.
</footer>

<script>

  { id:11, name:"Performance Running Tee", style:"sport",      emoji:"🏃", bg:"#e8f5e9",  price:34.99, old:44.99, badge:"SALE",  colors:["#66bb6a","#fff","#333"] },

  { id:13, name:"Cargo Shorts",            style:"outdoor",    emoji:"🩳", bg:"#f1f8e9",  price:42.99, old:null,  badge:null,    colors:["#558b2f","#795548","#000"] },
  { id:14, name:"Wrap Midi Dress",         style:"elegant",    emoji:"👗", bg:"#f3e5f5",  price:79.99, old:99.99, badge:"SALE",  colors:["#ab47bc","#000","#fff"] },

  { id:20, name:"Wide Leg Trousers",       style:"elegant",    emoji:"👖", bg:"#efebe9",  price:84.99, old:null,  badge:"NEU",   colors:["#8d6e63","#000","#f5f5f5"] },
  { id:21, name:"Puffer Vest",             style:"outdoor",    emoji:"🦺", bg:"#fff9c4",  price:64.99, old:79.99, badge:"SALE",  colors:["#f9a825","#111","#f44336"] },
  { id:22, name:"Oversized Flannel Shirt", style:"casual",     emoji:"🪡", bg:"#fbe9e7",  price:44.99, old:null,  badge:null,    colors:["#d84315","#5d4037","#000"] },
  { id:23, name:"Neon Windbreaker",        style:"streetwear", emoji:"🧥", bg:"#e8f5e9",  price:89.99, old:null,  badge:"NEU",   colors:["#00e676","#f50057","#111"] },
  { id:24, name:"Knit Cardigan",           style:"vintage",    emoji:"🧶", bg:"#fff8e1",  price:57.99, old:72.99, badge:"SALE",  colors:["#ffb74d","#fff","#4a148c"] },
  { id:25, name:"Yoga Leggings",           style:"sport",      emoji:"🧘", bg:"#e8eaf6",  price:37.99, old:null,  badge:"NEU",   colors:["#5c6bc0","#111","#ff4081"] },
];

function renderCards(items) {
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(p => `
    <div class="card" data-style="${p.style}">
      <div class="card-visual" style="background:${p.bg}">
        ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
        <span>${p.emoji}</span>
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <span class="style-tag">${p.style.charAt(0).toUpperCase()+p.style.slice(1)}</span>
        <div class="card-footer">
          <div>
            <span class="price">€${p.price.toFixed(2)}</span>
            ${p.old ? `<span class="old-price">€${p.old.toFixed(2)}</span>` : ''}
          </div>
          <div class="color-dots">
            ${p.colors.map(c=>`<div class="dot" style="background:${c}"></div>`).join('')}
          </div>
        </div>
        <button class="btn-cart" onclick="addToCart('${p.name}')">In den Warenkorb</button>
      </div>
    </div>
  `).join('');
}

function filter(btn, style) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = style === 'all' ? products : products.filter(p => p.style === style);
  renderCards(filtered);
}

function addToCart(name) {
  const btn = event.target;
  btn.textContent = '✓ Hinzugefügt';
  btn.style.background = '#2e7d32';
  setTimeout(() => {
    btn.textContent = 'In den Warenkorb';
    btn.style.background = '';
  }, 1800);
}

renderCards(products);
</script>
</body>
</html>
