<title>Messbogen RL-Zipper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: Messbogen wie ein Werkstattblatt, Schwesterblatt zur Eightyfive. Oben drei Skizzen mit nummerierten Messpunkten, darunter die Felder in derselben Nummerierung */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#172031; --muted:#566076; --line:#d7dce5;
  --copper:#9c5a30; --stitch:#c9976f; --red:#a8302a; --ok:#2c6e4c; --warn:#9a5410;
  --garment:#eee7d8; --garment-line:#7a6a52; --zip:#4b3a2c;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#151c27; --ink:#e4e8ef; --muted:#9aa3b4; --line:#283244;
    --copper:#e09f6c; --stitch:#7d5c42; --red:#e8766f; --ok:#73c899; --warn:#eaa95f;
    --garment:#2a2620; --garment-line:#c4b39a; --zip:#cdb99e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#151c27; --ink:#e4e8ef; --muted:#9aa3b4; --line:#283244;
  --copper:#e09f6c; --stitch:#7d5c42; --red:#e8766f; --ok:#73c899; --warn:#eaa95f;
  --garment:#2a2620; --garment-line:#c4b39a; --zip:#cdb99e; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:860px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7vw,44px);line-height:1.04;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:10px 0 0;max-width:64ch}
.rules{margin:0;padding:14px 16px 14px 34px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.status .count{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.save{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.save.saved{color:var(--ok)} .save.pending,.save.saving{color:var(--warn)} .save.err{color:var(--red)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px}
.fig figcaption{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.fig svg{display:block;width:100%;height:auto;max-width:100%}
.gm{fill:var(--garment);stroke:var(--garment-line);stroke-width:1.6}
.hole{fill:var(--surface);stroke:var(--garment-line);stroke-width:1.4}
.sm{fill:none;stroke:var(--garment-line);stroke-width:1.1}
.st{fill:none;stroke:var(--garment-line);stroke-width:0.9;stroke-dasharray:3 2.4;opacity:.8}
.rib{fill:none;stroke:var(--garment-line);stroke-width:0.6;opacity:.55}
.pk{fill:none;stroke:var(--garment-line);stroke-width:1.4}
.cd{fill:none;stroke:var(--garment-line);stroke-width:1.5;stroke-linecap:round}
.zp{fill:none;stroke:var(--zip);stroke-width:2.8;stroke-dasharray:1.2 0.9}
.zl{fill:none;stroke:var(--zip);stroke-width:0.8}
.lp{fill:var(--garment);stroke:var(--garment-line);stroke-width:1}
.bt{fill:var(--copper)}
.ml{stroke:var(--copper);stroke-width:1.5;fill:none}
.ml.dash{stroke-dasharray:3 3;stroke-width:1}
.bd circle{fill:var(--copper)}
.bd text{fill:var(--surface);font-family:var(--f-mono);font-size:9.5px;font-weight:500;text-anchor:middle}
.group{display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:2px dashed var(--stitch)}
h2{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0}
.gnote{margin:0;color:var(--muted);font-size:15px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 128px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--copper);color:var(--surface);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}
.row label{font-weight:600;display:block}
.how{margin:2px 0 0;color:var(--muted);font-size:14px}
.warn{margin:4px 0 0;color:var(--warn);font-size:14px}
.field{display:flex;align-items:center;gap:6px}
.field input{width:100%;min-width:0;font:inherit;font-family:var(--f-mono);font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
.field span{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:34px}
.row.wide{grid-template-columns:minmax(0,1fr)}
.row.wide .field input{text-align:left}
.row.filled{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}
input:focus-visible,button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.copy{display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:2px dashed var(--stitch)}
.copy button{align-self:flex-start;font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;min-height:42px}
.copy pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
@media (max-width:760px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.figs{grid-template-columns:minmax(0,1fr)} .row{grid-template-columns:30px minmax(0,1fr)} .row .field{grid-column:2}}
</style>

{"title": "Weiten", "note": "Flach von Kante zu Kante messen, nicht verdoppeln. Rippen nicht dehnen.", "items": [

{"k": "weite_rippe", "n": 2, "t": "Weite über der Saumrippe", "how": "Direkt über der Naht, an der die Saumrippe angenäht ist, von Kante zu Kante.", "min": 42, "max": 76, "unit": "cm"},

{"k": "oberarm", "n": 4, "t": "Oberarm", "how": "Ein Ärmel, 2,5 cm unter der Achsel, quer zum Ärmel.", "min": 16, "max": 34, "unit": "cm"},

{"title": "Längen", "note": "Das Maßband liegt gerade, nicht über Falten.", "items": [

{"k": "ruecken", "n": 7, "t": "Rückenlänge Mitte", "how": "Kapuze nach vorn klappen. Hinten in der Mitte von der Kapuzennaht bis zur Unterkante der Saumrippe.", "min": 56, "max": 84, "unit": "cm"},
{"k": "schulter", "n": 8, "t": "Schulterbreite", "how": "Hinten, von Schulternaht zu Schulternaht, dort wo der Ärmel angenäht ist.", "min": 38, "max": 68, "unit": "cm"},
{"k": "aermel", "n": 9, "t": "Ärmellänge", "how": "Von der Schulternaht oben am Ärmel entlang bis zum Ende der Rippe.", "min": 48, "max": 76, "unit": "cm"},
{"k": "armloch", "n": 10, "t": "Armloch gerade", "how": "Gerade Linie von der Schulternaht bis zur Achsel, entlang der Ärmelnaht.", "min": 19, "max": 35, "unit": "cm"},
{"k": "zip", "n": 11, "t": "Reißverschluss", "how": "Sichtbare Länge der Zähne, vom unteren Ende bis ganz oben.", "min": 48, "max": 80, "unit": "cm"}]},
{"title": "Kapuze", "note": "Die Kapuze hat ihre eigene Skizze. 14 und 15 legen fest, wo der Druck unter der Kapuze hinkommt.", "items": [
{"k": "kapuze_hoehe", "n": 12, "t": "Kapuzenhöhe", "how": "Kapuze seitlich flach hinlegen. Von der Naht am Hals bis zum höchsten Punkt.", "min": 28, "max": 46, "unit": "cm"},
{"k": "kapuze_breite", "n": 13, "t": "Kapuzenbreite", "how": "Kapuze seitlich flach. Von der vorderen Kante bis zur hinteren Naht, an der breitesten Stelle.", "min": 19, "max": 34, "unit": "cm"},
{"k": "kapuze_liegt", "n": 14, "t": "Liegende Kapuze, Tiefe", "how": "Zipper anziehen oder flach mit Kapuze nach hinten: von der Kapuzennaht hinten Mitte bis zum tiefsten Punkt der liegenden Kapuze.", "min": 14, "max": 40, "unit": "cm"},

<script>(function(){
  var F=JSON.parse(document.getElementById('fields').textContent);
  var app=document.getElementById('app');
  var DOC='messungen/rl-zipper', LS='nvl-messbogen-rl';
  var vals={}, dirty={}, focusKey=null, ref=null, mode='wait', timer=null, writing=false, again=false, retried=false;
  try{vals=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){vals={};}
  var NUM=[];F.groups.forEach(function(g){g.items.forEach(function(it){NUM.push(it);});});
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function num(v){if(v==null)return NaN;var s=String(v).trim().replace(',','.');return s===''?NaN:Number(s);}
  function statusText(){return {wait:'Verbindet …',local:'Speichern hier nicht möglich. Unten kopieren und mir schicken.',ro:'Nur lesen',saved:'Gespeichert, Claude kann es lesen',pending:'Noch nicht gespeichert',saving:'Speichert …',err:'Speichern fehlgeschlagen, unten kopieren'}[mode]||'';}
  function setMode(m){mode=m;var s=document.getElementById('save');if(s){s.className='save '+m;s.textContent=statusText();}}
  function filledCount(){return NUM.filter(function(it){return !isNaN(num(vals[it.k]));}).length;}
  function unitSuffix(u){return u==='cm'?' cm':(u==='g'?' g':'');}
  function warnText(it){var v=num(vals[it.k]);if(isNaN(v))return '';
    if(it.k==='rippe_saum'&&v<5&&v>=it.min)return 'Unter 5 cm passt der Stern nicht auf die Rippe. Wert stimmt? Dann wird unsere Rippe höher.';
    if(v<it.min||v>it.max){if(it.k==='gewicht')return 'Ungewöhnliches Gewicht, bitte noch mal wiegen.';
      return it.k==='brust'&&v>it.max?'Ungewöhnlich groß. Hast du den ganzen Umfang gemessen? Gemeint ist flach von Kante zu Kante.':'Ungewöhnlicher Wert, bitte noch mal messen.';}return '';}
  function refreshRow(it){var r=document.getElementById('row-'+it.k);if(!r)return;var w=r.querySelector('.warn');var t=warnText(it);w.textContent=t;w.hidden=!t;
    r.classList.toggle('filled',!isNaN(num(vals[it.k])));}
  function refreshCount(){var c=document.getElementById('cnt');if(c)c.textContent=filledCount()+' von '+NUM.length+' Maßen';var p=document.getElementById('sum');if(p)p.textContent=summary();}
  function onInput(k,v){vals[k]=v;dirty[k]=true;try{localStorage.setItem(LS,JSON.stringify(vals));}catch(e){}
    NUM.forEach(function(it){if(it.k===k)refreshRow(it);});refreshCount();schedule();}
  function input(k,ph,isNum){var i=el('input');i.id='in-'+k;i.type='text';if(isNum){i.inputMode='decimal';i.autocomplete='off';}i.placeholder=ph||'';i.value=vals[k]||'';
    i.addEventListener('input',function(){onInput(k,i.value);});i.addEventListener('focus',function(){focusKey=k;});i.addEventListener('blur',function(){focusKey=null;});return i;}
  function summary(){var lines=['RL-Zipper, flach gemessen:'];
    NUM.forEach(function(it){var v=vals[it.k];if(v&&String(v).trim())lines.push(it.n+' '+it.t+': '+String(v).trim()+unitSuffix(it.unit));});
    F.label.forEach(function(l){var v=vals[l.k];if(v&&String(v).trim())lines.push(l.t+': '+String(v).trim());});
    return lines.join('\n');}
  function render(){
    var h=el('header');h.append(el('p','eyebrow','Novalife · Time Travel · NVL-TT-02 Zipper'),el('h1',null,'Messbogen RL-Zipper'),
      el('p','lede','Dein weißer Ralph-Lauren-Zipper wird die Basis für unseren eigenen Schnitt. Daraus rechne ich die Passform: Schultern 3–5 cm überschnitten, Länge wie ein normaler Slim Fit, Ärmel normal lang. Jeder Wert speichert sich beim Tippen, ich lese ihn danach aus.'));
    app.append(h);
    var ol=el('ol','rules');['Zipper flach auf einen Tisch legen, Reißverschluss zu, Kapuze nach hinten.','Glatt streichen, nicht am Stoff ziehen, Rippen nicht dehnen.','In Zentimetern, auf einen halben Zentimeter genau. Komma oder Punkt geht beides.','Weiten nie verdoppeln: nur einmal von Kante zu Kante.','Fotos im Chat schicken: vorn flach, hinten flach mit liegender Kapuze, Kapuze seitlich, eine Tasche von nah, Saumrippe mit Maßband, Etikett innen.'].forEach(function(t){ol.append(el('li',null,t));});
    app.append(ol);
    var st=el('div','status');var c=el('span','count');c.id='cnt';var s=el('span','save '+mode,statusText());s.id='save';s.setAttribute('role','status');st.append(c,s);app.append(st);
    var figs=el('div','figs');[['Vorn','svg-front'],['Hinten','svg-back'],['Kapuze seitlich','svg-hood']].forEach(function(f){var fg=el('figure','fig');fg.innerHTML=document.getElementById(f[1]).innerHTML;fg.append(el('figcaption',null,f[0]));figs.append(fg);});
    app.append(figs);
    F.groups.forEach(function(g){var sec=el('section','group');sec.append(el('h2',null,g.title),el('p','gnote',g.note));var rows=el('div','rows');
      g.items.forEach(function(it){var r=el('div','row');r.id='row-'+it.k;var n=el('span','num',String(it.n));n.setAttribute('aria-hidden','true');
        var b=el('div');b.style.minWidth='0';var lab=el('label',null,it.n+'. '+it.t);lab.htmlFor='in-'+it.k;var w=el('p','warn');w.hidden=true;b.append(lab,el('p','how',it.how),w);
        var fd=el('div','field');fd.append(input(it.k,'',true),el('span',null,it.unit));r.append(n,b,fd);rows.append(r);});
      sec.append(rows);app.append(sec);});
    var sec=el('section','group');sec.append(el('h2',null,'Etikett und Gefühl'),el('p','gnote','Vom Pflegeetikett innen. Ist viel Polyester drin, fällt unser Baumwoll-Sweat anders, dann gleiche ich das aus.'));
    var rows=el('div','rows');F.label.forEach(function(l){var r=el('div','row wide');var b=el('div');var lab=el('label',null,l.t);lab.htmlFor='in-'+l.k;b.append(lab);var fd=el('div','field');fd.append(input(l.k,l.ph,false));b.append(fd);r.append(b);rows.append(r);});
    sec.append(rows);app.append(sec);
    var cp=el('section','copy');cp.append(el('h2',null,'Als Text'),el('p','gnote','Falls das Speichern nicht klappt: kopieren und mir im Chat schicken.'));
    var btn=el('button',null,'Text kopieren');btn.type='button';btn.id='copybtn';var pre=el('pre');pre.id='sum';pre.textContent=summary();
    btn.addEventListener('click',function(){var t=summary();pre.textContent=t;
      try{navigator.clipboard.writeText(t).then(function(){btn.textContent='Kopiert';setTimeout(function(){btn.textContent='Text kopieren';},1800);},function(){selectPre(pre);});}catch(e){selectPre(pre);}});
    cp.append(btn,pre);app.append(cp);
    NUM.forEach(refreshRow);refreshCount();
  }
  function selectPre(pre){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
  function schedule(){if(!ref){if(mode==='wait')setMode('local');return;}if(mode==='ro')return;setMode('pending');clearTimeout(timer);timer=setTimeout(flush,1000);}
  function flush(){if(!ref)return;if(writing){again=true;return;}writing=true;setMode('saving');var sent=Object.assign({},dirty);
    ref.set({values:Object.assign({},vals),updated:new Date().toISOString()}).then(function(){writing=false;Object.keys(sent).forEach(function(k){delete dirty[k];});
      if(again){again=false;flush();}else setMode('saved');},function(e){writing=false;var c=e&&e.code;
      if(c==='unavailable'&&!retried){retried=true;setTimeout(flush,700+Math.random()*900);return;}
      if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){setMode('ro');return;}setMode('err');});}
  render();
  var cl=window.claude;
  if(cl&&typeof cl.use==='function'){cl.use('db').then(function(db){if(!db){setMode('local');return;}ref=db.doc(DOC);setMode('saved');
    ref.onSnapshot(function(snap){if(!snap.exists)return;var d=snap.data()||{};var v=d.values||{};
      Object.keys(v).forEach(function(k){if(k===focusKey||dirty[k])return;if(vals[k]===v[k])return;vals[k]=v[k];var i=document.getElementById('in-'+k);if(i)i.value=v[k];});
      try{localStorage.setItem(LS,JSON.stringify(vals));}catch(e){}NUM.forEach(refreshRow);refreshCount();},function(){setMode('err');});},function(){setMode('local');});}
  else{setMode('local');}
})();
</script>
